services:
  web:
    build: .
    ports:
      - "8765:8765"
    environment:
      PORT: "8765"
      HOST: "0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 12s
    restart: unless-stopped
