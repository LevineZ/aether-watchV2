services:
  ncview:
    build:
      context: .
      dockerfile: apps/ncview/Dockerfile
    environment:
      NCVIEW_ROOT_PATH: "/ncview"
    expose:
      - "8770"
    volumes:
      - ncview-uploads:/app/uploads
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8765:8765"
    environment:
      PORT: "8765"
      HOST: "0.0.0.0"
      NCVIEW_UPSTREAM: "http://ncview:8770"
    depends_on:
      - ncview
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 12s
    restart: unless-stopped

volumes:
  ncview-uploads:
